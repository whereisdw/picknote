<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 96" role="img" aria-label="카본은 매트와 조절기, 온수는 매트와 물 데우는 본체가 호스로 이어짐"><style>svg{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif}.mt{fill:#fff;stroke:#1c1c1e;stroke-width:1.5}.hw,.tb{fill:none;stroke:#8e8e93;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.cd,.hs{fill:none;stroke:#1c1c1e;stroke-width:2}.hs{stroke-width:4}.bx{fill:#8e8e93}.bx2{fill:#1c1c1e}.lb{font-size:11px;fill:#55555a}@media (prefers-color-scheme:dark){.mt{fill:#1c1c1e;stroke:#f2f2f7}.cd,.hs{stroke:#f2f2f7}.bx2{fill:#f2f2f7}.lb{fill:#c7c7cc}}</style><rect x="2" y="6" width="96" height="62" rx="8" class="mt"/><polyline points="12,14 24,60 36,14 48,60 60,14 72,60 84,14" class="hw"/><path d="M98 37 H112" class="cd"/><rect x="112" y="28" width="22" height="18" rx="4" class="bx"/><text x="2" y="88" class="lb">카본 · 열선과 조절기, 물 없음</text><rect x="176" y="6" width="96" height="62" rx="8" class="mt"/><path d="M186 16 H262 V30 H186 V44 H262 V58 H186" class="tb"/><path d="M272 37 C284 37 286 37 290 37" class="hs"/><rect x="290" y="20" width="40" height="34" rx="6" class="bx2"/><text x="176" y="88" class="lb">온수 · 호스로 잇는 본체, 물통 700ml</text></svg>